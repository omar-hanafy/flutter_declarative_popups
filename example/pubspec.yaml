name: example
description: Demonstrates declarative popups with Navigator and go_router.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_declarative_popups:
    path: ../
  go_router: ^18.0.2
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
