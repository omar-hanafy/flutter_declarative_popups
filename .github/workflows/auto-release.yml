name: Auto release

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version channel check
        run: bash scripts/check-version-lane.sh "$GITHUB_REF_NAME"

      - name: Compare package versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'Branch creation detected; no release tag will be created.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new_version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          old_version=$(git show "$BEFORE_SHA:pubspec.yaml" | awk '/^version:/ {print $2; exit}' | tr -d "\"'")
          if [[ "$old_version" == "$new_version" ]]; then
            echo "Version remains $new_version; no release tag will be created."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'changed=true'
            echo "value=$new_version"
            echo "tag=flutter_declarative_popups-v$new_version"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/release-notes.py "$RELEASE_VERSION" CHANGELOG.md "$RUNNER_TEMP/release-notes.md"

      - name: Verify tag is new
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists. Never move or reuse a release tag."
            exit 1
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_PAT }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          args=("$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_NAME" == dev ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
